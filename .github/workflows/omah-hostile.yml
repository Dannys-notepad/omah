name: Omah hostile test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omah-hostile
  cancel-in-progress: false

jobs:
  hostile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_REPO: Dannys-notepad/omah-hostile-test
      INPUT_TASK: Hostile security test — see test/hostile-task.json
      INPUT_BASE_BRANCH: ""
      INPUT_RESUME: "false"
      INPUT_BRANCH: ""
      INPUT_RESUME_TEXT: ""
      GEMINI_KEYS: '["unused"]'
      OMAH_SCRIPT: /tmp/omah-attack/script.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create agent user and lock down runner files
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash omah-runner || true
          sudo mkdir -p /tmp/omah-attack
          sudo chmod 1777 /tmp/omah-attack
          mkdir -p /tmp/omah
          chmod 755 /tmp/omah
          sudo chmod o-rwx "$HOME"
          chmod 700 "$RUNNER_TEMP"

      - name: Isolation canary
        run: |
          set -u
          fail=0
          denied()  { local d="$1"; shift; if "$@" >/dev/null 2>&1; then echo "LEAK:   $d"; fail=1; else echo "ok:     $d"; fi; }
          allowed() { local d="$1"; shift; if "$@" >/dev/null 2>&1; then echo "ok:     $d"; else echo "BROKEN: $d"; fail=1; fi; }
          as_agent() { sudo -u omah-runner env PATH="$PATH" HOME=/home/omah-runner "$@"; }
          # Real targets: own pid, own parent, and the runner user's shell.
          denied  "agent cannot read own environ"       as_agent cat /proc/$$/environ
          denied  "agent cannot read parent environ"    as_agent cat /proc/$PPID/environ
          denied  "agent cannot list runner home"       as_agent ls /home/runner
          denied  "agent cannot list runner temp"       as_agent ls "$RUNNER_TEMP"
          denied  "agent cannot read GITHUB_ENV"        as_agent cat "$GITHUB_ENV"
          denied  "agent cannot read GITHUB_WORKSPACE"  as_agent ls "$GITHUB_WORKSPACE"
          denied  "agent has no sudo"                   as_agent sudo -n true
          denied  "agent cannot use docker"             as_agent docker ps
          allowed "agent can run node"                  as_agent node --version
          allowed "agent can run git"                   as_agent git --version
          allowed "agent can write its home"            as_agent touch /home/omah-runner/.canary
          [[ "$fail" -eq 0 ]] || { echo "::error::isolation canary failed"; exit 1; }

      - name: Prepare attack
        run: |
          set -euo pipefail
          cp test/hostile-task.json /tmp/omah-attack/script.json
          cp test/sink.ts           /tmp/omah-attack/sink.ts
          cp test/sniff.sh          /tmp/omah-attack/sniff.sh
          cp test/attack.sh         /tmp/omah-attack/attack.sh
          cp test/plant.sh          /tmp/omah-attack/plant.sh
          sudo chmod 644 /tmp/omah-attack/script.json
          sudo chmod 644 /tmp/omah-attack/sink.ts
          sudo chmod 755 /tmp/omah-attack/sniff.sh
          sudo chmod 755 /tmp/omah-attack/attack.sh
          sudo chmod 755 /tmp/omah-attack/plant.sh
          # Start the sink, sniffer, and control as omah-runner.
          sudo -u omah-runner env PATH="$PATH" HOME=/home/omah-runner \
            bash /tmp/omah-attack/attack.sh

      - name: Run Omah
        id: omah
        continue-on-error: true
        env:
          INPUT_REPO: ${{ env.INPUT_REPO }}
          INPUT_TASK: ${{ env.INPUT_TASK }}
          INPUT_BASE_BRANCH: ${{ env.INPUT_BASE_BRANCH }}
          INPUT_RESUME: ${{ env.INPUT_RESUME }}
          INPUT_BRANCH: ${{ env.INPUT_BRANCH }}
          INPUT_RESUME_TEXT: ${{ env.INPUT_RESUME_TEXT }}
          GEMINI_KEYS: ${{ env.GEMINI_KEYS }}
          OMAH_SCRIPT: ${{ env.OMAH_SCRIPT }}
          APP_ID: ${{ secrets.OMAH_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.OMAH_APP_PRIVATE_KEY }}
          APP_BOT_ID: ${{ vars.OMAH_APP_BOT_ID }}
        run: |
          set +e
          npx tsx agent.ts
          echo "AGENT_EXIT=$?" >> "$GITHUB_ENV"

      - name: Kill agent processes
        if: always()
        run: sudo pkill -9 -u omah-runner || true

      - name: Check
        env:
          BRANCH: ${{ steps.omah.outputs.branch }}
        run: |
          bash test/check.sh